name: Django CI

on:
  push:
    branches: [ Develop ]
  pull_request:
    branches: [ Develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
        # Install tools
        pip install ruff black bandit safety pytest pytest-django

    # -------------------------
    # LINTING (Ruff)
    # -------------------------
    - name: Run Ruff
      run: |
        ruff check .

    # -------------------------
    # FORMAT CHECK (Black)
    # -------------------------
    - name: Check formatting with Black
      run: |
        black --check .

    # -------------------------
    # SECURITY CHECK (Bandit)
    # -------------------------
    - name: Run Bandit
      run: |
        bandit -r .

    # -------------------------
    # DEPENDENCY CHECK (Safety)
    # -------------------------
    - name: Run Safety
      run: |
        safety check

    # -------------------------
    # UNIT TESTS (Django/DRF)
    # -------------------------
    - name: Run Tests
      env:
        DJANGO_SETTINGS_MODULE: your_project.settings
      run: |
        python manage.py test
