name: Django CI

on:
  push:
    branches: [ Develop ]
  pull_request:
    branches: [ Develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gopPythonDB
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gopPythonDB"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: gopPythonDB
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      JWT_ACCESS_TOKEN_LIFETIME: 15m
      JWT_REFRESH_TOKEN_LIFETIME: 7d
      OAUTH2_ACCESS_TOKEN_EXPIRE_SECONDS: 3600
      OAUTH2_AUTHORIZATION_CODE_EXPIRE_SECONDS: 300
      OAUTH2_REFRESH_TOKEN_EXPIRE_SECONDS: 86400

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
        # Install tools
        pip install ruff black bandit safety pytest pytest-django

    # -------------------------
    # LINTING (Ruff)
    # -------------------------
    - name: Run Ruff
      run: |
        ruff check .

    # -------------------------
    # FORMAT CHECK (Black)
    # -------------------------
    - name: Check formatting with Black
      run: |
        black --check .

    # -------------------------
    # SECURITY CHECK (Bandit)
    # -------------------------
    - name: Run Bandit
      run: |
        bandit -r .

    # -------------------------
    # DEPENDENCY CHECK (Safety)
    # -------------------------
    - name: Run Safety
      run: |
        safety check

    # -------------------------
    # UNIT TESTS (Django/DRF)
    # -------------------------
    - name: Run Tests
      run: |
        python manage.py test
